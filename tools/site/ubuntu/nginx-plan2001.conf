# plan2001.com on Ubuntu: the static site, the ISO, the browser machine and
# its virtual Ethernet (tools/site/ubuntu).  Installed as
# /etc/nginx/sites-available/plan2001.
server {
    listen 80;
    listen [::]:80;
    server_name plan2001.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plan2001.com;
    ssl_certificate /etc/letsencrypt/live/plan2001.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan2001.com/privkey.pem;

    root /var/www/plan2001;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript text/javascript application/wasm;

    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # the machine's Ethernet: a WebSocket to tools/gateway, a frame a message
    location = /ether {
        proxy_pass http://127.0.0.1:17080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # cross-origin isolated: the machine's memory is a SharedArrayBuffer
    location /plan9-wasm32/ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    # the ISO: Range requests and its true size; never gzipped (the machine
    # reads it as a disk, and needs Content-Length and 206)
    location /iso/ {
        gzip off;
        gzip_static off;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
