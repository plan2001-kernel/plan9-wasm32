name: Rio touch selection (wasm32 Chromium)

on:
  push:
    branches:
      - feat/wasm32-touch-keyboard-fullscreen-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rio-touch-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact PR commit
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            p7zip-full bubblewrap cpio meson ninja-build pkg-config \
            libcap-dev libseccomp-dev libselinux1-dev \
            gcc make python3 curl patch git \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxext-dev libxt-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if ! bwrap --help 2>&1 | grep -q -- '--overlay-src'; then
            git clone --depth=1 --branch v0.11.0 https://github.com/containers/bubblewrap.git /tmp/bubblewrap
            meson setup /tmp/bubblewrap-build /tmp/bubblewrap
            ninja -C /tmp/bubblewrap-build
            sudo ninja -C /tmp/bubblewrap-build install
          fi
          bwrap --version

      - name: Install Chromium
        run: |
          curl -fLsS https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
          sudo apt-get install -y /tmp/chrome.deb
          sudo ln -sf "$(command -v google-chrome)" /usr/local/bin/chromium
          chromium --version

      - name: Install Plan 9 build tools
        run: |
          git clone --depth=1 https://github.com/9fans/plan9port.git "$HOME/plan9port"
          cd "$HOME/plan9port"
          ./INSTALL
          test -x bin/mk && test -x bin/rc && test -x bin/yacc

      - name: Cache pinned 9front release ISO
        uses: actions/cache@v4
        with:
          path: ~/.cache/plan9-wasm32
          key: 9front-11952-amd64-iso

      - name: Build and test actual wasm32 Rio text selection
        shell: bash
        run: |
          set -euo pipefail
          export PLAN9="$HOME/plan9port"
          echo "Git commit: $(git rev-parse HEAD)"
          tools/test/run riotouch | tee build/test/actions-riotouch.log
          sha256sum build/live/9wasm32.wasm build/live/platform.js | tee build/test/compiled-sha256.txt
          grep -q '^PASS: riotouch$' build/test/actions-riotouch.log
          echo "Verified: Rio selected text and character ranges match riotouch.check"

      - name: Upload guest serial output, Chromium logs and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm32-rio-touch-selection
          path: |
            build/test/*.log
            build/test/*.txt
            build/test/*.png
            build/test/build.log
            build/test/native.log
            build/native.log
          if-no-files-found: warn
